name: Preview

# Main is always at https://sui.smyklot.com, and a pull request that changes what the kitchen
# sink renders gets its own copy at /pr-<number>. Setup is in preview/README.md.
on:
  # Every push, so a dependency update that changes the sink reaches the root too.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - '.github/workflows/preview.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  FLY_APP: sui-previews
  PREVIEW_HOST: sui.smyklot.com
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  PR: ${{ github.event.pull_request.number }}
  BASE_PATH: ${{ github.event.pull_request.number && format('/pr-{0}', github.event.pull_request.number) || '' }}
  # Renovate moves the version; the digest moves by hand from the release asset's digest, and
  # a version without its digest fails the install.
  FLYCTL_VERSION: 0.4.119
  FLYCTL_SHA256: bb8f916814f12bccf794889b0375dd10b075b60f965607fc39d89ecdad79dbcc

jobs:
  deploy:
    # Pull requests from forks get no secrets.
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'main' || 'preview' }}
      url: https://${{ env.PREVIEW_HOST }}${{ env.BASE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      # The setup-flyctl action gave up after 3 tries when GitHub's release downloads answered
      # 504 for minutes; curl keeps trying for up to 10 minutes.
      - &install-flyctl
        name: Install flyctl
        run: |
          bin="$RUNNER_TEMP/flyctl"
          mkdir -p "$bin"
          curl -fsSL --retry 10 --retry-all-errors --retry-max-time 600 -o "$bin/flyctl.tgz" \
            "https://github.com/superfly/flyctl/releases/download/v$FLYCTL_VERSION/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "$FLYCTL_SHA256  $bin/flyctl.tgz" | sha256sum -c -
          tar -xzf "$bin/flyctl.tgz" -C "$bin" flyctl
          echo "$bin" >> "$GITHUB_PATH"
      # The machine stops when idle and only an HTTP request starts it again.
      - run: curl -fsS --retry 10 --retry-all-errors -o /dev/null "https://$PREVIEW_HOST/ping"
      # A separate assignment, so a failed listing stops the step instead of reading as no open PRs.
      - run: |
          open=$(gh pr list --state open --limit 1000 --json number --jq '[.[].number | tostring] | join(" ")')
          tar -cz -C build . | flyctl ssh console -a "$FLY_APP" -C "/usr/local/bin/previews ${PR:-main} $open"

  remove:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - *install-flyctl
      - run: curl -fsS --retry 10 --retry-all-errors -o /dev/null "https://$PREVIEW_HOST/ping"
      - run: |
          open=$(gh pr list --state open --limit 1000 --json number --jq '[.[].number | tostring] | join(" ")')
          flyctl ssh console -a "$FLY_APP" -C "/usr/local/bin/previews - $open"
