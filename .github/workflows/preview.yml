name: Preview

# Main is always at https://sui.tercenas.com, and a pull request that changes what the kitchen
# sink renders gets its own copy at /pr-<number>. Setup is in preview/README.md.
on:
  # Only a change to the look deploys. A dependency update alone is checked by the visual test
  # group, so it deploys only when it changes the look and its Linux pictures are recorded again.
  push:
    branches: [main]
    paths: &look
      - 'src/**'
      - 'vite.config.ts'
      - 'tests/browser/visual/linux/**'
      - '.github/workflows/preview.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: *look

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  FLY_APP: sui-previews
  PREVIEW_HOST: sui.tercenas.com
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  PR: ${{ github.event.pull_request.number }}
  BASE_PATH: ${{ github.event.pull_request.number && format('/pr-{0}', github.event.pull_request.number) || '' }}
  # Renovate moves the tag and its digest together, so keep the three lines in this order.
  # renovate: datasource=github-release-attachments depName=superfly/flyctl
  FLYCTL_VERSION: v0.5.5
  FLYCTL_SHA256: 2c64e1c7f320fafed0452fbce9adff57fcaf733619f0faa315ae883ec03d7ef6

jobs:
  deploy:
    # Pull requests from forks get no secrets.
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'main' || 'preview' }}
      url: https://${{ env.PREVIEW_HOST }}${{ env.BASE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build:site
        env:
          VITE_PREVIEWS: 'true'
      # The setup-flyctl action gave up after 3 tries when GitHub's release downloads answered
      # 504 for minutes; curl keeps trying for up to 10 minutes.
      - &install-flyctl
        name: Install flyctl
        run: |
          bin="$RUNNER_TEMP/flyctl"
          mkdir -p "$bin"
          curl -fsSL --retry 10 --retry-all-errors --retry-max-time 600 -o "$bin/flyctl.tgz" \
            "https://github.com/superfly/flyctl/releases/download/$FLYCTL_VERSION/flyctl_${FLYCTL_VERSION#v}_Linux_x86_64.tar.gz"
          echo "$FLYCTL_SHA256  $bin/flyctl.tgz" | sha256sum -c -
          tar -xzf "$bin/flyctl.tgz" -C "$bin" flyctl
          echo "$bin" >> "$GITHUB_PATH"
      # The machine stops when idle and only an HTTP request starts it again.
      - run: curl -fsS --retry 10 --retry-all-errors -o /dev/null "https://$PREVIEW_HOST/ping"
      # A separate assignment, so a failed listing stops the step instead of reading as no open PRs.
      - &list-open
        name: List open pull requests
        run: |
          open=$(gh pr list --state open --limit 1000 --json number,title --jq "$(cat preview/open.jq)")
          echo "OPEN=$open" >> "$GITHUB_ENV"
      # A deploy of the server restarts its machine and cuts the upload short. `previews` installs
      # through incoming/, so the same upload simply runs again.
      - run: |
          for _ in 1 2 3; do
            curl -fsS --retry 10 --retry-all-errors -o /dev/null "https://$PREVIEW_HOST/ping"
            tar -cz -C build . | flyctl ssh console -a "$FLY_APP" -C "/usr/local/bin/previews ${PR:-main} $OPEN" && exit
            sleep 30
          done
          exit 1

  remove:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: preview
      - *install-flyctl
      - run: curl -fsS --retry 10 --retry-all-errors -o /dev/null "https://$PREVIEW_HOST/ping"
      - *list-open
      - run: |
          for _ in 1 2 3; do
            curl -fsS --retry 10 --retry-all-errors -o /dev/null "https://$PREVIEW_HOST/ping"
            flyctl ssh console -a "$FLY_APP" -C "/usr/local/bin/previews - $OPEN" && exit
            sleep 30
          done
          exit 1
