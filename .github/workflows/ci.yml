name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise run install:ci
      - run: mise run validate

  browser:
    # The visual group compares pictures recorded by `mise run test:visual:linux`, so it runs in
    # the same browser image on the same architecture. The other groups use the runner's Chrome.
    runs-on: ${{ matrix.group == 'visual' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.group == 'visual' && 'mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea' || '' }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - a11y
          - forms
          - lists
          - navigation
          - navigation-layout
          - overlays
          - words
          - offline
          - visual
          - kitchen-audit
          - kitchen-sweeps
          - kitchen-press
          - kitchen
          - performance
          - clock
          - motion
          - reload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise run install:ci
      - run: mise run test:browser:ci "$SUI_TEST_GROUP"
        env:
          SUI_TEST_GROUP: ${{ matrix.group }}
          SUI_BROWSER_CHANNEL: ${{ matrix.group == 'visual' && 'chromium' || 'chrome' }}
