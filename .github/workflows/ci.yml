name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - run: mise run install:ci
      - run: mise run validate

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - a11y
          - forms
          - lists
          - navigation
          - navigation-layout
          - overlays
          - words
          - offline
          - visual
          - kitchen-audit
          - kitchen-sweeps
          - kitchen-press
          - kitchen
          - performance
          - clock
          - motion
          - reload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - run: mise run install:ci
      - run: mise run test:browser:ci "$SUI_TEST_GROUP"
        env:
          SUI_TEST_GROUP: ${{ matrix.group }}
