#:schema https://smyklot.com/schema/repository-panel-v1.json

# CI runs Prettier over every synced file, so the JSON Smyklot writes takes Prettier's layout:
# objects stay expanded, and an array stays on one line only while it is short. The limit
# stands in for Prettier's line width, which counts the key that Smyklot leaves out.
[formatting.common]
inline_max_chars = 80

[formatting.json]
arrays = "auto"
objects = "expanded"

# The organization's renovate.json gains this repository's own version limits, groups and
# custom managers.
[panel]
version = 1
scope = 'repository'

[panel.sync.files]
document = '''{
  "merges": [
    {
      "path": "renovate.json",
      "overrides": {
        "packageRules": [
          {
            "description": "svelte-check and svelte-package need the TypeScript 6 JS API; TypeScript 7 runs as @typescript/native",
            "matchPackageNames": ["typescript"],
            "allowedVersions": "<7"
          },
          {
            "description": "Keep Node types aligned with the Node 24 LTS runtime",
            "matchPackageNames": ["@types/node"],
            "allowedVersions": ">=24 <25"
          },
          {
            "description": "The visual group runs in the Playwright image whose browsers playwright-core expects, so both move together",
            "groupName": "playwright",
            "matchPackageNames": ["playwright-core", "mcr.microsoft.com/playwright"]
          }
        ],
        "customManagers": [
          {
            "customType": "regex",
            "description": "The Playwright image of the visual group in CI and of its recording task",
            "managerFilePatterns": ["/^\\.github/workflows/ci\\.yml$/", "/^\\.mise\\.toml$/"],
            "matchStrings": [
              "(?<depName>mcr\\.microsoft\\.com/playwright):(?<currentValue>v[0-9.]+-noble)@(?<currentDigest>sha256:[a-f0-9]{64})"
            ],
            "datasourceTemplate": "docker"
          },
          {
            "customType": "regex",
            "description": "The flyctl the preview deploy installs; its FLYCTL_SHA256 moves by hand",
            "managerFilePatterns": ["/^\\.github/workflows/preview\\.yml$/"],
            "matchStrings": ["FLYCTL_VERSION: (?<currentValue>[0-9.]+)"],
            "depNameTemplate": "superfly/flyctl",
            "datasourceTemplate": "github-releases",
            "extractVersionTemplate": "^v(?<version>.+)$"
          }
        ]
      },
      "arrays": [
        {"path": "$.packageRules", "strategy": "append"},
        {"path": "$.customManagers", "strategy": "append"}
      ]
    }
  ]
}'''
