<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Paints the first frame in the theme ThemeSwitch would pick, which it can only set
      // once the app has started. Keep the key and the fallback the same as ThemeSwitch uses.
      {
        let theme;
        try {
          theme = localStorage.getItem('sui:theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.suiTheme = theme;
      }
    </script>
    <style>
      :root[data-sui-fonts='pending'] body {
        visibility: hidden;
      }
    </style>
    <!-- The first paint waits until the parser reaches the main content, so the chrome above
         it never paints half parsed on a slow connection and then rearranges. -->
    <link rel="expect" href="#content" blocking="render" />

    %sveltekit.head%
    <script>
      // A face is decoded only once text first asks for it, which is after the first layout,
      // so a cold load would paint a frame or two in another face. The faces are asked for
      // here, once the stylesheets above have declared them, and the page shows its ground
      // alone until they are ready. A face that never arrives holds it no longer than the
      // browser's own block period.
      {
        const root = document.documentElement;
        const show = () => delete root.dataset.suiFonts;
        root.dataset.suiFonts = 'pending';
        Promise.allSettled([
          document.fonts.load('1em "SUI Plus Jakarta Sans"'),
          document.fonts.load('1em "SUI JetBrains Mono"')
        ]).then(show);
        setTimeout(show, 3000);
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
