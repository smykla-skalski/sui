<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Paints the first frame in the theme ThemeSwitch would pick, which it can only set
      // once the app has started. Keep the key and the fallback the same as ThemeSwitch uses.
      {
        let theme;
        try {
          theme = localStorage.getItem('sui:theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.suiTheme = theme;
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
