# The kitchen sink of main and of every PR, on one machine that stops when idle.
# oauth2-proxy signs visitors in with GitHub, lets in only members of the org, and
# passes them to busybox httpd, which serves /data/previews/ from the volume: main at
# the root, each PR in pr-<number>/, and main's 404.html for anything missing.
#
# Secrets, set once with `fly secrets set` (see README.md):
#   OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
app = "sui-previews"
primary_region = "fra"

[env]
  OAUTH2_PROXY_HTTP_ADDRESS = "0.0.0.0:4180"
  OAUTH2_PROXY_PROVIDER = "github"
  OAUTH2_PROXY_GITHUB_ORG = "smykla-skalski"
  OAUTH2_PROXY_EMAIL_DOMAINS = "*"
  OAUTH2_PROXY_REDIRECT_URL = "https://sui.tercenas.com/oauth2/callback"
  OAUTH2_PROXY_UPSTREAMS = "http://127.0.0.1:8080/"
  OAUTH2_PROXY_REVERSE_PROXY = "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON = "true"

[[mounts]]
  source = "previews"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 4180
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
